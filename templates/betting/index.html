{% extends "layouts/base.html" %}
{% block title %}Place Bet - BetPro{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="fw-bold mb-1">
            <i class="fas fa-futbol text-gold me-2"></i>
            Place a Bet
        </h4>
        <p class="text-muted small mb-0">
            Click on odds to add selections to your bet slip
        </p>
    </div>

    <div>
        <button class="btn btn-gold btn-sm" onclick="openBetSlip()">
            <i class="fas fa-receipt me-1"></i>
            Bet Slip
            <span class="badge bg-dark ms-1" id="betslipCountHeader">0</span>
        </button>
    </div>
</div>

<div class="row g-4">

    <div class="col-lg-9">

        <!-- Sports Filter -->

        ...

        <!-- Matches -->

        ...

    </div>

    <!-- Desktop Bet Slip -->
    <div class="col-lg-3 d-none d-lg-block">
        <div class="glass-card position-sticky" style="top:80px;">
            {% include "betting/bet_slip.html" %}
        </div>
    </div>

</div>

<!-- Floating Button -->
<button
    class="floating-betslip-btn"
    id="betslipFloatingBtn"
    onclick="toggleBetSlip()">

    <i class="fas fa-receipt"></i>

    <span
        class="badge bg-warning text-dark"
        id="betslipFloatingCount">

        {{ bet_slip_selections|length if bet_slip_selections is defined else 0 }}

    </span>

</button>

{% endblock %}

{% block extra_js %}

<script>

document.addEventListener("DOMContentLoaded", function () {

    function updateHeaderCount() {

        const header = document.getElementById("betslipCountHeader");

        if (!header) return;

        try {

            const saved = sessionStorage.getItem("betpro_betslip");

            const selections = saved ? JSON.parse(saved) : [];

            header.textContent = selections.length;

        } catch {

            header.textContent = 0;

        }

    }

    updateHeaderCount();

    setInterval(updateHeaderCount,1000);

});

</script>

{% endblock %}
