<div id="betslipPanelInline" class="betslip-panel">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->
    <div class="betslip-header d-flex justify-content-between align-items-center">

        <div>
            <h5 class="fw-bold mb-0">
                <i class="fas fa-receipt text-warning me-2"></i>
                Bet Slip
                <span id="betslipCount" class="badge bg-warning text-dark ms-2">0</span>
            </h5>

            <small class="text-muted">
                Your selected bets
            </small>
        </div>

        <button
            type="button"
            class="btn btn-outline-light btn-sm d-lg-none"
            onclick="closeBetSlip()">

            <i class="fas fa-times"></i>

        </button>

    </div>


    <!-- ========================= -->
    <!-- EMPTY STATE -->
    <!-- ========================= -->
    <div
        id="betslipEmpty"
        class="betslip-empty text-center">

        <i class="fas fa-ticket-alt fa-3x text-secondary mb-3"></i>

        <h6 class="fw-bold">
            Your Bet Slip is Empty
        </h6>

        <p class="text-muted mb-0">
            Tap any odds to add a selection.
        </p>

    </div>


    <!-- ========================= -->
    <!-- SELECTIONS -->
    <!-- ========================= -->
    <div
        id="betslipSelectionsArea"
        class="betslip-body"
        style="display:none;">

        <div id="betslipSelections"></div>

    </div>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->
    <div
        id="betslipFooter"
        class="betslip-footer"
        style="display:none;">

        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Bet Type</span>
            <strong id="betslipType">Single</strong>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Selections</span>
            <strong id="betslipCount2">0</strong>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Total Odds</span>
            <strong
                id="betslipTotalOdds"
                class="text-warning">
                0.00
            </strong>
        </div>

        <div class="mb-3">

            <label class="form-label">
                Stake (KES)
            </label>

            <input
                id="betslipStake"
                type="number"
                class="form-control"
                min="10"
                step="10"
                placeholder="Minimum 10"
                oninput="calculatePotential()">

        </div>

        <div class="alert alert-success d-flex justify-content-between align-items-center">

            <span>
                Potential Win
            </span>

            <strong id="betslipPotential">
                KES 0.00
            </strong>

        </div>

        <div class="form-check mb-3">

            <input
                class="form-check-input"
                type="checkbox"
                id="betslipUseBonus">

            <label
                class="form-check-label"
                for="betslipUseBonus">

                Use Bonus Balance

            </label>

        </div>

        <button
            id="betslipPlaceBtn"
            type="button"
            class="btn btn-warning w-100 fw-bold mb-2"
            onclick="placeBet()">

            <i class="fas fa-check-circle me-2"></i>

            Place Bet

        </button>

        <button
            id="betslipClear"
            type="button"
            class="btn btn-outline-danger w-100"
            onclick="clearBetSlip()">

            <i class="fas fa-trash me-2"></i>

            Clear Bet Slip

        </button>

    </div>

</div>
